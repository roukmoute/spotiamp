[package]
name = "spotiamp"
version = "0.2.12"
edition = "2024"
rust-version = "1.89"
description = "A small native, classic-style Spotify player"
license = "MIT"
default-run = "spotiamp"

[features]
default = ["spotify", "updates"]
updates = ["dep:libc", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tempfile", "dep:semver", "dep:zip", "dep:flate2"]
spotify = ["dep:protobuf", "dep:rand", "dep:librespot-core", "dep:librespot-playback", "dep:librespot-metadata", "dep:librespot-oauth", "dep:librespot-protocol", "dep:tokio", "dep:keyring", "dep:serde_json", "dep:url", "dep:rodio"]

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dependencies]
# Release binaries keep warnings/errors; verbose library logs stay available in debug builds.
log = { version = "0.4", default-features = false, features = ["release_max_level_warn"] }
protobuf = { version = "3.7", optional = true }
rand = { version = "0.9", default-features = false, features = ["thread_rng"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "system-proxy"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
semver = { version = "1", optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"], optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
minifb = { version = "0.29", default-features = false, features = ["x11"] }
font8x8 = "0.3"
arboard = { version = "3", default-features = false }
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-protocol = { version = "=0.8.0", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"], optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
rodio = { version = "0.21", default-features = false, features = ["playback"], optional = true }

[dev-dependencies]
# Virtual time for transport scheduling tests; excluded from release builds.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"], optional = true }

[[bin]]
name = "engine_probe"
path = "src/bin/engine_probe.rs"
required-features = ["spotify"]

[[bin]]
name = "audio_probe"
path = "src/bin/audio_probe.rs"
required-features = ["spotify"]

[profile.release]
# Preserve speed optimizations while optimizing across all crate boundaries.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
minifb = { path = "vendor/minifb" }
librespot-playback = { path = "vendor/librespot-playback" }
