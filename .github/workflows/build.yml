name: Build and check

on:
  push:
    # A release tag points to an already checked commit; avoid rebuilding it twice.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libdbus-1-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev pkg-config xvfb xdotool x11-utils openbox
      - name: Fetch locked dependency manifests for packaging
        # cargo metadata needs manifests from all targets, even with --filter-platform.
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check reproducible Windows S icon assets
        run: python scripts/generate_windows_icon.py --check
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Test playback quality changes
        run: cargo test --locked -p librespot-playback --lib quality_tests --target ${{ matrix.target }}
      - name: Test native X11 window controls, pointer and wheel events
        if: runner.os == 'Linux'
        run: LC_ALL=C XMODIFIERS=@im=none xvfb-run -a cargo test --locked --bin spotiamp --target ${{ matrix.target }} x11_ -- --ignored --test-threads=1
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }} --bin spotiamp
      - name: Compare Windows size, startup and idle memory against 0.1.5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baselineZip = Join-Path $env:RUNNER_TEMP 'Spotiamp-perf-0.1.5.zip'
          $baselineDir = Join-Path $env:RUNNER_TEMP 'Spotiamp-perf-0.1.5'
          Invoke-WebRequest -Uri 'https://github.com/roukmoute/spotiamp/releases/download/v0.1.5/Spotiamp-Windows-x64.zip' -OutFile $baselineZip
          if ((Get-FileHash -LiteralPath $baselineZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '05e6293b351c185ccb66cf6b1972d246482e6ae50afb551e2d12cd9b9920fa83') {
            throw 'Published performance baseline SHA256 mismatch'
          }
          Expand-Archive -LiteralPath $baselineZip -DestinationPath $baselineDir
          ./scripts/compare-windows-performance.ps1 -BaselineExe (Join-Path $baselineDir 'spotiamp.exe') -CandidateExe target/${{ matrix.target }}/release/spotiamp.exe -OutputDirectory dist/performance-tests
      - name: Upload Windows performance measurements
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: spotiamp-windows-performance
          path: dist/performance-tests/
          if-no-files-found: warn
      - name: Smoke test native macOS window on the main thread
        if: runner.os == 'macOS'
        run: |
          target/${{ matrix.target }}/release/spotiamp --no-update-check --library --quit-after 2
          target/${{ matrix.target }}/release/spotiamp --test-library-windows
      - name: Package binary, sources, and dependency licenses
        run: python scripts/package.py --target ${{ matrix.target }}
      - name: Validate packaged archive through the native updater
        env:
          SPOTIAMP_RELEASE_ARCHIVE: dist/spotiamp-${{ matrix.target }}.zip
        run: cargo test --locked --bin spotiamp --target ${{ matrix.target }} updater::package::tests::release_archive_passes_native_update_validation -- --exact --ignored --nocapture
      - name: Build the per-user Windows installer from the validated ZIP
        if: runner.os == 'Windows'
        run: python scripts/build_windows_installer.py --archive dist/spotiamp-${{ matrix.target }}.zip --expected-commit "${{ github.sha }}" --output-dir dist
      - name: Test native Windows install, upgrade, reinstall and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'Spotiamp-alpha8-Windows-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/roukmoute/spotiamp/releases/download/v0.1.0-alpha.8/Spotiamp-Windows-x64.zip' -OutFile $baseline
          if ((Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0798093954888d728a341617e108d5f6dfad58647e538fd7b33b685371e7f579') {
            throw 'Published baseline archive SHA256 mismatch'
          }
          ./scripts/test_windows_installer.ps1 -SetupExe dist/Spotiamp-Setup-Windows-x64.exe -PortableZip dist/spotiamp-${{ matrix.target }}.zip -BaselineZip $baseline -ExpectedVersion (Get-Content Cargo.toml | Select-String '^version = "([^"]+)"' | ForEach-Object { $_.Matches.Groups[1].Value }) -OutputDirectory dist/installer-tests
      - name: Upload Windows installer diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: spotiamp-windows-installer-diagnostics
          path: |
            dist/Spotiamp-Setup-Windows-x64.build.json
            dist/installer-tests/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        # The action already retries transient HTTP errors (five attempts).
        # Exhausted retries must still fail the job so missing artifacts stay visible.
        with:
          name: spotiamp-${{ matrix.target }}
          path: |
            dist/spotiamp-${{ matrix.target }}.zip
            dist/spotiamp-source.zip
            dist/Spotiamp-Setup-Windows-x64.exe
          if-no-files-found: error
